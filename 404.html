<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Between floors · Xander Hudson</title>
  <meta name="theme-color" content="#131417">
  <meta name="robots" content="noindex">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..800&family=Homemade+Apple&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .stuck { min-height: 100svh; display: grid; place-items: center; padding: 40px var(--gutter); text-align: center; }
    .doors { position: relative; width: min(78vw, 320px); aspect-ratio: 3 / 4; margin: 0 auto 30px; background: linear-gradient(180deg, #ffb071, #a24d47 60%, #2a1f2c); box-shadow: 0 0 0 10px #2a2c31, 0 0 0 12px rgba(184,146,90,.55), 0 30px 60px rgba(0,0,0,.5); overflow: hidden; }
    .doors::before, .doors::after { content: ""; position: absolute; top: 0; bottom: 0; width: 46%; background: repeating-linear-gradient(90deg, #8d8f96 0 2px, #6e7077 2px 5px), #7a7c83; box-shadow: inset 0 0 30px rgba(0,0,0,.4); animation: jam 3.2s var(--ease) infinite alternate; }
    .doors::before { left: 0; } .doors::after { right: 0; }
    @keyframes jam { from { translate: 0 0; } to { translate: -3% 0; } }
    .doors::after { animation-name: jam-r; } @keyframes jam-r { from { translate: 0 0; } to { translate: 3% 0; } }
    .panel { display: inline-flex; gap: 8px; margin-bottom: 18px; }
    .panel span { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-head); font-size: 14px; box-shadow: inset 0 0 0 1.5px rgba(184,146,90,.55); color: var(--bone-dim); }
    .panel span.on { color: var(--ink); background: var(--sunset); box-shadow: 0 0 14px rgba(255,106,61,.55); animation: blink 1.2s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .35; } }
    .stuck h1 { font-size: clamp(44px, 12vw, 88px); }
    .stuck p { color: var(--bone-dim); margin: 14px auto 28px; max-width: 32ch; }
  </style>
</head>
<body>
  <main class="stuck">
    <div>
      <div class="doors" aria-hidden="true"></div>
      <div class="panel" aria-hidden="true"><span>L</span><span class="on">?</span><span>1</span><span>2</span></div>
      <h1>Stuck between floors.</h1>
      <p>This page isn&rsquo;t in the building. Ride back down and start again.</p>
      <a class="btn btn--hit" href="./">Back to the lobby</a>
    </div>
  </main>
</body>
</html>
