<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Xander Hudson</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4efe6; color: #1d1a16; font: 16px/1.5 Georgia, serif; text-align: center; padding: 16px; }
    a { color: inherit; }
  </style>
</head>
<body>
  <!-- Smart link: counts the click (which account's bio it came from, which campaign), then sends the fan on.
       Made in Encore, e.g. go.html?to=<pre-save link>&utm_source=afterhours.tapes-tt&utm_campaign=paper-planets
       Only music, social and pre-save services are allowed as destinations, so the link can't be abused. -->
  <p id="msg">Taking you there…</p>
  <script src="content/config.js"></script>
  <script>
    (function () {
      var ALLOWED = /(^|\.)(spotify\.com|spotify\.link|apple\.com|music\.apple\.com|youtube\.com|youtu\.be|music\.youtube\.com|tiktok\.com|instagram\.com|soundcloud\.com|bandcamp\.com|deezer\.com|tidal\.com|amazon\.com|music\.amazon\.com|distrokid\.com|hyperfollow\.com|feature\.fm|ffm\.to|ffm\.bio|linkfire\.com|lnk\.to|toneden\.io|show\.co|smarturl\.it|presave\.io|songwhip\.com|linktr\.ee|bit\.ly|xanderhudson\.com|alexanderh8809-oss\.github\.io)$/i;
      var p = new URLSearchParams(location.search), home = "./";
      var to = p.get("to") || "", dest = home, host = "home";
      try {
        var u = new URL(to);
        if (u.protocol === "https:" && ALLOWED.test(u.hostname)) { dest = u.href; host = u.hostname.replace(/^www\./, ""); }
      } catch (e) { /* not a link: go home */ }
      var api = ((window.SITE || {}).backend || "").trim();
      var vid = ""; try { vid = localStorage.getItem("xh_vid") || ""; if (!vid) { vid = Math.random().toString(36).slice(2, 12); localStorage.setItem("xh_vid", vid); } } catch (e) {}
      var src = (p.get("utm_source") || "direct").toLowerCase().slice(0, 40);
      try { sessionStorage.setItem("xh_src", src); } catch (e) {} // if they come back to the site in this visit, it still credits this link
      var ev = { visitor: vid, session: "", page: "go.html", source: src, referrer: (function () { try { return new URL(document.referrer).hostname.replace(/^www\./, ""); } catch (e) { return ""; } })(),
        event: "smartlink_click", detail: ((p.get("utm_campaign") || "").slice(0, 40) + " " + host).trim(),
        device: matchMedia("(pointer: coarse)").matches ? "phone" : "computer", tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || ""), lang: navigator.language || "", screen: screen.width + "x" + screen.height };
      if (api) {
        var body = JSON.stringify({ type: "events", events: [ev] });
        try { if (!(navigator.sendBeacon && navigator.sendBeacon(api, new Blob([body], { type: "text/plain" })))) fetch(api, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "text/plain" }, body: body }); } catch (e) {}
      }
      document.getElementById("msg").innerHTML = 'Taking you there… <a href="' + dest.replace(/"/g, "&quot;") + '">Tap here</a> if nothing happens.';
      setTimeout(function () { location.replace(dest); }, 150);
    })();
  </script>
</body>
</html>
