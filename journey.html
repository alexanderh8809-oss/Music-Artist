<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Journey · Xander Hudson</title>
  <meta name="description" content="Xander Hudson's life in music, stage by stage.">
  <meta name="theme-color" content="#131417">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..800&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/journey.css">
</head>
<body class="journey-page">
  <header class="site-header">
    <a class="wordmark" href="./">Xander Hudson</a>
    <nav class="site-nav" aria-label="Floors">
      <a class="floor" href="./"><i>L</i>Lobby</a>
      <a class="floor" href="journey.html" aria-current="page"><i>1</i>Journey</a>
      <a class="floor" href="merch.html"><i>2</i>Postcards</a>
      <a class="floor" href="fans.html"><i>3</i>Fans</a>
      <a class="floor" href="contact.html"><i>4</i>Industry</a>
      <a class="btn btn--hit btn--sm hide-sm" href="#join" data-join>Join</a>
    </nav>
  </header>

  <!-- The board stays put; scrolling moves the camera along the string -->
  <main class="cam" aria-label="Journey">
    <div class="board" aria-hidden="true"></div>
    <div class="bgs" aria-hidden="true"></div>
    <div class="world"></div>
    <div class="vignette" aria-hidden="true"></div>
  </main>

  <!-- The years down the left, with his age at each stage -->
  <nav class="rail" aria-label="Years"></nav>

  <nav class="controls" aria-label="Journey stages">
    <button class="ctl ctl--prev" type="button" aria-label="Previous stage">&uarr;</button>
    <span class="ctl__count" aria-live="polite"></span>
    <button class="btn btn--hit ctl--next" type="button">Next stage</button>
  </nav>

  <div class="editbar" hidden>
    <span class="label">Edit mode</span>
    <button class="btn btn--sm" type="button" data-act="add">+ Add stage</button>
    <button class="btn btn--sig btn--sm" type="button" data-act="download">Download journey.js</button>
    <button class="btn btn--sm" type="button" data-act="reset">Discard edits</button>
  </div>

  <script src="content/config.js"></script>
  <script src="content/journey.js"></script>
  <script src="js/site.js"></script>
  <script src="js/journey.js"></script>
</body>
</html>
