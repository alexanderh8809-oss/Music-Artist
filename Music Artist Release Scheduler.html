<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xander Hudson · Release HQ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f1e6;--sf:#fffaf0;--ln:#e3d9c8;--tx:#1e1a16;--mu:#7b7062;--vd:#2a8575;--or:#e8691f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#13110f;--sf:#1d1a17;--ln:#322c26;--tx:#f1e9dc;--mu:#a29686;--vd:#45b8a4;--or:#f2812f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#13110f;--sf:#1d1a17;--ln:#322c26;--tx:#f1e9dc;--mu:#a29686;--vd:#45b8a4;--or:#f2812f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:6px 11px}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:6px 9px;max-width:100%}
.pr{background:var(--or);border-color:var(--or);color:#fff;font-weight:600}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--ln)}
.brand b{font:800 23px 'Playfair Display',Georgia,serif}.brand small{color:var(--or);font-weight:600;margin-left:8px;text-transform:uppercase;letter-spacing:.12em;font-size:11px}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hr label{display:flex;gap:6px;align-items:center;color:var(--mu)}#cd{font-weight:600;color:var(--or)}
nav{display:flex;gap:4px;padding:8px 18px;overflow-x:auto;border-bottom:1px solid var(--ln)}nav button{border:0;background:none;white-space:nowrap;font-weight:500}nav .on{background:var(--tx);color:var(--bg)}
main{max-width:1180px;margin:0 auto;padding:18px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
h2{font:800 19px 'Playfair Display',Georgia,serif;margin:0 0 10px}.big{font:800 30px 'Playfair Display',Georgia,serif}.mu{color:var(--mu)}
.bar{height:7px;border-radius:9px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--vd)}
.row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--ln)}.row .m{flex:1;min-width:0;cursor:pointer}.row small{display:block;color:var(--mu)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.pri{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}.ph{background:var(--or);color:#fff;border-color:var(--or)}.pm{color:var(--vd);border-color:var(--vd)}
.od small b{color:var(--or)}.done .m b{text-decoration:line-through;opacity:.5}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.sh{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.tl{border-left:2px solid var(--ln);margin-left:6px;padding-left:18px}.wk{position:relative;margin-bottom:20px}.wk:before{content:'';position:absolute;left:-25px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--vd)}.wk.now:before{background:var(--or)}.wk h3{margin:0 0 4px;font-size:14px}
.gt{overflow:auto;border:1px solid var(--ln);border-radius:12px;background:var(--sf);max-height:72vh}.gw{position:relative;background-position:190px 0}
.gr{position:relative;height:28px}.gh{position:sticky;top:0;z-index:4;background:var(--sf);border-bottom:1px solid var(--ln)}
.gl{position:sticky;left:0;z-index:3;width:190px;height:28px;padding:5px 8px;background:var(--sf);border-right:1px solid var(--ln);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gs .gl{font-weight:700}
.gb{position:absolute;top:6px;height:16px;border-radius:5px;color:#fff;font-size:10px;line-height:16px;padding:0 5px;overflow:hidden;white-space:nowrap;cursor:pointer}
.gv{position:absolute;top:0;bottom:0;width:2px;z-index:2;pointer-events:none}.gk{position:absolute;top:8px;font-size:10px;color:var(--mu)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{display:flex;flex-direction:column;gap:4px;width:92px}.sw input[type=color]{width:100%;height:42px;padding:2px}
.cv{max-width:100%;max-height:260px;border-radius:10px;display:block;margin-bottom:8px}label{display:block;margin-bottom:8px;color:var(--mu);font-size:12px}label input,label select,label textarea{display:block;width:100%;margin-top:3px;color:var(--tx);font-size:14px}
.asc{display:flex;flex-direction:column;gap:5px;margin:0}.asc .tg{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--vd);font-weight:600}.asc a{text-decoration:none;text-align:center;border-radius:8px;padding:6px}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--tx);width:min(560px,94vw);max-height:90vh;padding:18px}dialog::backdrop{background:#0008}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.w2{grid-column:span 2}.acts{display:flex;gap:8px;margin-top:12px}.sr{display:flex;gap:6px;margin:5px 0}.sr input[type=text]{flex:1}
</style></head><body>
<header><div class="brand"><b>Xander Hudson</b><small>Release HQ</small></div>
<div class="hr"><label>Release day <input type="date" id="rd"></label><span id="cd"></span><button id="th">Theme</button><button id="bk">Backup</button></div></header>
<nav id="nav"></nav><main id="app"></main><dialog id="dlg"></dialog>
<script>
const KEY='xhhq1',DAY=864e5,$=s=>document.querySelector(s),D=$('#dlg');
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const parse=s=>new Date(s+'T00:00:00'),iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},dd=(a,b)=>Math.round((a-b)/DAY);
const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'}),uid=()=>Math.random().toString(36).slice(2,8);
const url=u=>/^https?:\/\//i.test(u)?u:u?'https://'+u:'';
const PN={h:'High',m:'Med',l:'Low'},PO={h:0,m:1,l:2},AT=['Canva','Drive / Dropbox','Audio','Video','Social','Press kit','Contract','Other'];
const ST=[['Finish the song','#e8691f'],['Paperwork & rights','#2a8575'],['Distribution','#d9a21b'],['Cover art','#8d6e63'],['Artist profiles','#3b7f9e'],['Pitching','#7d6bb0'],['Content prep','#c9577a'],['Teaser campaign','#5b9e4d'],['Release day','#e0332b'],['After release','#8a7f70']];
// [stage, title, start (days from release), days, priority, hours, notes]
const T=[[0,'Final vocal session',-70,3,'h',3,'Record and comp the best take of each line.'],[0,'Vocal editing & tuning',-67,3,'h',3,'Remove breaths and clicks that distract.'],[0,'Finalize arrangement',-64,3,'m',2,'Lock where every section starts and ends.'],[0,'Rough mix + listening tests',-61,2,'h',2,'Earbuds, car/speaker, phone. Write notes from each.'],[0,'Feedback round',-59,5,'m',1,'2-3 trusted people. Ask specific questions.'],[0,'Fix mix, export final WAV',-54,3,'h',3,'24-bit WAV.'],[0,'Mastering',-51,5,'h',2,'Engineer or AI tool. Compare to a reference. Keep clean + instrumental.'],[0,'Back up everything',-46,1,'m',1,'Two places: drive + cloud.'],
[1,'Splits & sample clearances',-56,5,'h',2,'Contributors, percentages in writing, licenses for any beat/sample.'],[1,'PRO / MLC / SoundExchange',-50,5,'m',2,'Register song, writers, splits.'],
[2,'Pick a distributor',-45,2,'m',1,'Compare cost, payout split, features.'],[2,'Build the release',-43,2,'h',2,'Title, contributors, explicit flag, artist name, upload master.'],[2,'Schedule release (4+ weeks out)',-41,1,'h',1,'Pick stores, add lyrics/Canvas, submit.'],
[3,'Concept + references',-49,3,'m',1,'One-sentence concept, ~5 reference images.'],[3,'Create or commission art',-46,10,'h',5,'3000x3000 px. Brief an artist early.'],[3,'Thumbnail test + export',-36,2,'m',1,'Check at ~100px. No URLs or handles. Keep a text-free version.'],
[4,'Artist photo shoot',-35,3,'m',3,'Artist photo + header image.'],[4,'Bio + platform profiles',-32,3,'m',2,'One bio everywhere: Spotify, Apple, YouTube, Amazon, Deezer.'],
[5,'Spotify pitch',-28,2,'h',1,'Submit 7+ days before release; earlier is better.'],[5,'Build curator + press list',-28,5,'m',3,'30+ curators, blogs, local outlets.'],[5,'Send personal pitches',-23,5,'h',2,'3-4 sentences + private link. No mass messages.'],[5,'Paid submissions (optional)',-21,3,'l',1,'Small test budget.'],
[6,'Content plan calendar',-28,3,'h',2,'One entry per day. Teaser, behind-the-scenes, lyric visuals.'],[6,'Pre-save + link-in-bio',-26,2,'h',1,'Same call to action every time.'],[6,'Filming day',-24,2,'h',4,'About 10 clips in one session.'],[6,'Editing session',-22,4,'h',4,'Vertical 9:16, hook in first 2 seconds, captions.'],[6,'Lyric video / visualizer (optional)',-24,7,'l',5,''],[6,'Music video (optional)',-35,21,'l',20,'Lock location, shot list, date 4+ weeks out.'],
[7,'Teaser posts, weeks 3-2',-21,7,'h',1,'3-4 posts per week. Reply to comments for an hour.'],[7,'Cover reveal + recruit sharers',-14,3,'m',1,'10 friends, exact date and link.'],[7,'Week-1 push + email list',-7,6,'m',1,'Follow up with curators who have not replied.'],[7,'Confirm release is scheduled',-2,1,'h',1,'Check distributor dashboard. Draft release-day posts.'],
[8,'Morning check + announcement',0,1,'h',2,'Confirm live everywhere, swap link-in-bio, post everywhere.'],[8,'Outreach block',0,1,'h',2,'Close contacts one by one, then curators and bloggers.'],[8,'Evening live / reaction clip',0,1,'m',1,''],
[9,'Post-release content',1,14,'m',1,'Every 2-3 days: live clips, reactions, lyric breakdown.'],[9,'Metadata audit',3,2,'m',1,'Lyrics synced, right artist profile, credits.'],[9,'Second pitch round',7,5,'m',2,'Use early stats. One follow-up per contact.'],[9,'Debrief + back up files',30,2,'m',2,'Streams, saves, followers, best content, what to change.'],[9,'Plan next release',32,2,'l',1,'Start earlier on whichever step took longest.']];
let S,F={s:'all',p:'all',q:'',hide:0},tab='dash';
function seed(){let d=add(today,72);while(d.getDay()!=5)d=add(d,1);
return{r:iso(d),stages:ST.map((s,i)=>({id:'s'+i,n:s[0],c:s[1]})),tasks:T.map(x=>({id:uid(),s:'s'+x[0],t:x[1],o:x[2],d:x[3],p:x[4],h:x[5],c:0,l:'',n:x[6],x:0,sub:[]})),rel:{},brand:{tag:'',bio:'',font:'Heavy serif wordmark, brush-script accent (sparingly), plain grotesque for captions',cols:[['Verdigris','#2a8575'],['Sunset orange','#e8691f'],['Ink','#1e1a16'],['Cream','#f7f1e6']],cover:'',assets:[]}}}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(x){}if(!S||!S.tasks)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}};
const rd=()=>parse(S.r),stg=id=>S.stages.find(s=>s.id==id)||S.stages[0];
const rowH=t=>{const s=add(rd(),t.o),en=add(s,t.d-1),od=!t.x&&en<today,sb=t.sub.length?` · ${t.sub.filter(x=>x.x).length}/${t.sub.length} steps`:'';
return`<div class="row ${t.x?'done':''} ${od?'od':''}"><input type="checkbox" data-a="tg" data-id="${t.id}" ${t.x?'checked':''}><i class="dot" style="background:${stg(t.s).c}"></i><div class="m" data-a="ed" data-id="${t.id}"><b>${e(t.t)}</b><small>${fmt(s)}${t.d>1?' – '+fmt(en):''}${t.h?' · '+t.h+'h':''}${sb}${t.c?' · $'+t.c:''}${t.l?` · <a href="${e(t.l)}" target="_blank" rel="noopener">link</a>`:''}${od?' · <b>overdue</b>':''}</small></div><span class="pri p${t.p}">${PN[t.p]}</span></div>`};
function vDash(){const R=rd(),N=S.tasks.length,dn=S.tasks.filter(t=>t.x).length,pc=N?Math.round(dn/N*100):0,hi=S.tasks.filter(t=>!t.x&&t.p=='h').length,cost=S.tasks.reduce((a,t)=>a+t.c,0),dl=dd(R,today);
const open=S.tasks.filter(t=>!t.x),foc=open.filter(t=>add(R,t.o+t.d-1)<today||add(R,t.o)<=add(today,7)).sort((a,b)=>PO[a.p]-PO[b.p]||a.o-b.o).slice(0,8),q=open.filter(t=>t.p=='h').sort((a,b)=>a.o-b.o).slice(0,8);
const RF=[['title','Song title'],['dist','Distributor'],['isrc','ISRC'],['upc','UPC'],['pre','Pre-save link'],['str','Streaming link']];
return`<div class="grid" style="margin-bottom:14px"><div class="card" style="margin:0"><div class="mu">Days to release</div><div class="big">${dl>0?dl:dl==0?'Today':'Out'}</div></div><div class="card" style="margin:0"><div class="mu">Tasks done</div><div class="big">${dn}/${N}</div><div class="bar"><i style="width:${pc}%"></i></div></div><div class="card" style="margin:0"><div class="mu">High priority open</div><div class="big">${hi}</div></div><div class="card" style="margin:0"><div class="mu">Budget planned</div><div class="big">$${cost}</div></div></div>
<div class="g2"><div class="card"><h2>Focus now</h2>${foc.map(rowH).join('')||'<p class="mu">Nothing due this week.</p>'}</div><div class="card"><h2>Priority queue</h2>${q.map(rowH).join('')||'<p class="mu">No open high-priority tasks.</p>'}</div></div>
<div class="g2"><div class="card"><h2>Stages</h2>${S.stages.map(s=>{const L=S.tasks.filter(t=>t.s==s.id),d=L.filter(t=>t.x).length;return`<div style="margin-bottom:10px"><div class="sh" style="margin:0 0 4px"><i class="dot" style="background:${s.c}"></i><b>${e(s.n)}</b><span style="flex:1"></span><span class="mu">${d}/${L.length}</span></div><div class="bar"><i style="width:${L.length?d/L.length*100:0}%;background:${s.c}"></i></div></div>`}).join('')}</div>
<div class="card"><h2>Release info</h2>${RF.map(f=>`<label>${f[1]}<input data-f="rel.${f[0]}" value="${e(S.rel[f[0]])}"></label>`).join('')}</div></div>`}
function vTasks(){return`<div class="tb"><input data-fl="q" placeholder="Search tasks" value="${e(F.q)}"><select data-fl="s"><option value="all">All stages${S.stages.map(s=>`<option value="${s.id}" ${F.s==s.id?'selected':''}>${e(s.n)}`).join('')}</select><select data-fl="p">${['all','h','m','l'].map(k=>`<option value="${k}" ${F.p==k?'selected':''}>${k=='all'?'Any priority':PN[k]}`).join('')}</select><label style="margin:0"><input type="checkbox" data-fl="hide" style="display:inline;width:auto" ${F.hide?'checked':''}> Hide done</label><span style="flex:1"></span><button data-a="ns">+ Stage</button><button class="pr" data-a="nt">+ Task</button></div><div id="tl"></div>`}
function drawList(){const q=F.q.toLowerCase();$('#tl').innerHTML=S.stages.filter(s=>F.s=='all'||F.s==s.id).map(s=>{const A=S.tasks.filter(t=>t.s==s.id),L=A.filter(t=>(F.p=='all'||t.p==F.p)&&!(F.hide&&t.x)&&(!q||(t.t+t.n).toLowerCase().includes(q))).sort((a,b)=>a.o-b.o);

function vTime(){const R=rd(),g={};S.tasks.slice().sort((a,b)=>a.o-b.o).forEach(t=>(g[Math.floor(t.o/7)]=g[Math.floor(t.o/7)]||[]).push(t));const tw=Math.floor(dd(today,R)/7);
return'<div class="tl">'+Object.keys(g).sort((a,b)=>a-b).map(w=>`<div class="wk ${w==tw?'now':''}"><h3>Week of ${fmt(add(R,w*7))} <span class="mu">· ${w<0?-w+' wk before':w==0?'release week':w+' wk after'}${w==tw?' · this week':''}</span></h3>${g[w].map(rowH).join('')}</div>`).join('')+'</div>'}
function vGantt(){const R=rd(),z=S.z||12,T2=S.tasks;if(!T2.length)return'<div class="card">No tasks yet.</div>';
const tO=dd(today,R),a=Math.min(...T2.map(t=>t.o),tO)-2,b=Math.max(...T2.map(t=>t.o+t.d),0)+3,n=b-a,W=190+n*z,X=o=>190+(o-a)*z;let h='';
for(let i=0;i<=n;i+=7)h+=`<span class="gk" style="left:${X(a+i)+3}px">${fmt(add(R,a+i))}</span>`;
let rows=`<div class="gr gh" style="width:${W}px"><div class="gl">Task</div>${h}</div>`;
S.stages.forEach(s=>{const L=S.tasks.filter(t=>t.s==s.id).sort((x,y)=>x.o-y.o);if(!L.length)return;const m=Math.min(...L.map(t=>t.o)),M=Math.max(...L.map(t=>t.o+t.d));
rows+=`<div class="gr gs"><div class="gl" style="color:${s.c}">${e(s.n)}</div><div class="gb" style="left:${X(m)}px;width:${(M-m)*z}px;background:${s.c};opacity:.3;top:10px;height:8px"></div></div>`;
L.forEach(t=>rows+=`<div class="gr"><div class="gl">${e(t.t)}</div><div class="gb" data-a="ed" data-id="${t.id}" title="${e(t.t)} (${fmt(add(R,t.o))})" style="left:${X(t.o)}px;width:${Math.max(t.d*z-2,6)}px;background:${s.c};opacity:${t.x?.35:1}${t.p=='h'?';outline:2px solid var(--tx);outline-offset:-2px':''}">${e(t.t)}</div></div>`)});
return`<div class="tb"><button data-a="zo">Zoom out</button><button data-a="zi">Zoom in</button><span class="mu">Green line = today · orange line = release day · outlined bars = high priority · click a bar to edit</span></div><div class="gt"><div class="gw" style="width:${W}px;background-image:repeating-linear-gradient(90deg,transparent 0,transparent ${z*7-1}px,var(--ln) ${z*7-1}px,var(--ln) ${z*7}px)">${rows}<div class="gv" style="left:${X(tO)}px;background:var(--vd)"></div><div class="gv" style="left:${X(0)}px;background:var(--or)"></div></div></div>`}
function vBrand(){const B=S.brand;return`<div class="g2"><div class="card"><h2>Identity</h2><label>Tagline<input data-f="brand.tag" value="${e(B.tag)}"></label><label>Artist bio<textarea rows="4" data-f="brand.bio">${e(B.bio)}</textarea></label><label>Type system<input data-f="brand.font" value="${e(B.font)}"></label><b>Palette</b><div class="sw" style="margin-top:6px">${B.cols.map((c,i)=>`<div><input type="color" data-f="brand.cols.${i}.1" value="${c[1]}"><input data-f="brand.cols.${i}.0" value="${e(c[0])}"></div>`).join('')}</div></div>
<div class="card"><h2>Cover art</h2>${B.cover?`<img class="cv" src="${B.cover}" alt="Cover art">`:'<p class="mu">No cover uploaded yet.</p>'}<input type="file" accept="image/*" id="cvf"><p class="mu">Saved on this device only, resized to 600px.</p></div></div>
<div class="card"><h2>Brand links & files</h2><div class="tb"><select id="a_t">${AT.map(t=>`<option>${t}`).join('')}</select><input id="a_n" placeholder="Title"><input id="a_u" placeholder="Paste a link (Canva, Drive, SoundCloud...)" style="flex:1;min-width:180px"><button class="pr" data-a="aa">Add</button></div><div class="grid">${B.assets.map(x=>`<div class="card asc"><span class="tg">${e(x.t)}</span><b>${e(x.n)}</b><a class="pr" href="${e(x.u)}" target="_blank" rel="noopener">Open</a><button data-a="da" data-id="${x.id}">Remove</button></div>`).join('')||'<p class="mu">Add your Canva boards, mood boards, press kit, contracts, demo links.</p>'}</div></div>`}
function draw(){$('#nav').innerHTML=[['dash','Dashboard'],['tasks','Tasks'],['time','Timeline'],['gantt','Gantt'],['brand','Brand hub']].map(([k,n])=>`<button data-a="tab" data-v="${k}" class="${tab==k?'on':''}">${n}</button>`).join('');
$('#app').innerHTML=({dash:vDash,tasks:vTasks,time:vTime,gantt:vGantt,brand:vBrand})[tab]();const dl=dd(rd(),today);$('#cd').textContent=dl>0?dl+' days to release':dl==0?'Release day':'Released';$('#rd').value=S.r;if(tab=='tasks')drawList()}
const subH=s=>`<div class="sr"><input type="checkbox" ${s.x?'checked':''}><input type="text" value="${e(s.t)}" placeholder="Sub-step"><button data-a="rs">×</button></div>`;
function openEd(id,sid){const R=rd();let t=S.tasks.find(x=>x.id==id);const nw=!t;if(nw)t={s:sid||(F.s!='all'?F.s:S.stages[0].id),t:'',o:Math.max(dd(today,R),-70),d:1,p:'m',h:0,c:0,l:'',n:'',x:0,sub:[]};
D.dataset.id=nw?uid():t.id;D.dataset.nw=nw?1:'';
D.innerHTML=`<h2>${nw?'New task':'Edit task'}</h2><div class="fg"><label class="w2">Title<input id="f_t" value="${e(t.t)}"></label><label>Stage<select id="f_s">${S.stages.map(s=>`<option value="${s.id}" ${t.s==s.id?'selected':''}>${e(s.n)}`).join('')}</select></label><label>Priority<select id="f_p">${['h','m','l'].map(k=>`<option value="${k}" ${t.p==k?'selected':''}>${PN[k]}`).join('')}</select></label><label>Start<input type="date" id="f_o" value="${iso(add(R,t.o))}"></label><label>Days<input type="number" min="1" id="f_d" value="${t.d}"></label><label>Hours<input type="number" min="0" step=".5" id="f_h" value="${t.h}"></label><label>Cost $<input type="number" min="0" id="f_c" value="${t.c}"></label><label class="w2">Link (Canva, Doc, folder...)<input id="f_l" value="${e(t.l)}"></label><label class="w2">Notes<textarea id="f_n" rows="3">${e(t.n)}</textarea></label></div><b>Sub-steps</b><div id="subs">${t.sub.map(subH).join('')}</div><button data-a="as">+ Sub-step</button><label style="margin-top:10px"><input type="checkbox" id="f_x" style="display:inline;width:auto" ${t.x?'checked':''}> Done</label><div class="acts">${nw?'':'<button data-a="dt">Delete</button>'}<span style="flex:1"></span><button data-a="cl">Cancel</button><button class="pr" data-a="sv">Save</button></div>`;D.showModal()}
function saveT(){const g=i=>$('#'+i).value,o={s:g('f_s'),t:g('f_t').trim()||'Untitled',p:g('f_p'),o:dd(parse(g('f_o')||iso(rd())),rd()),d:Math.max(1,+g('f_d')||1),h:+g('f_h')||0,c:+g('f_c')||0,l:url(g('f_l').trim()),n:g('f_n'),x:$('#f_x').checked?1:0,sub:[...D.querySelectorAll('.sr')].map(r=>({x:r.children[0].checked?1:0,t:r.children[1].value.trim()})).filter(s=>s.t)};
const t=S.tasks.find(x=>x.id==D.dataset.id);t?Object.assign(t,o):S.tasks.push({id:D.dataset.id,...o});save();D.close();draw()}
function openSt(id){const s=S.stages.find(x=>x.id==id);D.dataset.id=id||'';D.innerHTML=`<h2>${s?'Edit stage':'New stage'}</h2><label>Name<input id="g_n" value="${e(s?s.n:'')}"></label><label>Color<input type="color" id="g_c" value="${s?s.c:'#2a8575'}"></label><div class="acts">${s&&S.stages.length>1&&!S.tasks.some(t=>t.s==id)?'<button data-a="ds">Delete (empty stage)</button>':''}<span style="flex:1"></span><button data-a="cl">Cancel</button><button class="pr" data-a="ss">Save</button></div>`;D.showModal()}
function openBk(){D.innerHTML=`<h2>Backup & restore</h2><p class="mu">Copy this text somewhere safe. Paste a backup back in to restore it, on any device.</p><textarea id="bk_t" rows="8" style="width:100%">${e(JSON.stringify(S))}</textarea><p id="bk_m" class="mu"></p><div class="acts"><button data-a="rst">Reset to template</button><span style="flex:1"></span><button data-a="cl">Close</button><button class="pr" data-a="ld">Load pasted text</button></div>`;D.showModal()}
document.addEventListener('click',ev=>{if(ev.target.closest('a'))return;const a=ev.target.closest('[data-a]');if(!a)return;const k=a.dataset.a,id=a.dataset.id,t=S.tasks.find(x=>x.id==id),B=S.brand;
if(k=='tab'){tab=a.dataset.v;draw()}else if(k=='tg'){t.x=t.x?0:1;save();draw()}else if(k=='ed')openEd(id);else if(k=='nt')openEd(0,id);else if(k=='ns')openSt();else if(k=='es')openSt(id);
else if(k=='as')$('#subs').insertAdjacentHTML('beforeend',subH({t:'',x:0}));else if(k=='rs')a.parentElement.remove();else if(k=='cl')D.close();else if(k=='sv')saveT();
else if(k=='dt'){if(a.dataset.c){S.tasks=S.tasks.filter(x=>x.id!=D.dataset.id);save();D.close();draw()}else{a.dataset.c=1;a.textContent='Click again to delete'}}
else if(k=='ss'){const n=$('#g_n').value.trim()||'Stage',c=$('#g_c').value,s=S.stages.find(x=>x.id==D.dataset.id);s?Object.assign(s,{n,c}):S.stages.push({id:'s'+uid(),n,c});save();D.close();draw()}
else if(k=='ds'){S.stages=S.stages.filter(x=>x.id!=D.dataset.id);save();D.close();draw()}
else if(k=='zo'){S.z=Math.max(4,(S.z||12)-4);save();draw()}else if(k=='zi'){S.z=Math.min(40,(S.z||12)+4);save();draw()}
else if(k=='aa'){const u=url($('#a_u').value.trim());if(!u)return;B.assets.push({id:uid(),t:$('#a_t').value,n:$('#a_n').value.trim()||u,u});save();draw()}
else if(k=='da'){B.assets=B.assets.filter(x=>x.id!=id);save();draw()}
else if(k=='ld'){try{const o=JSON.parse($('#bk_t').value);if(!o.tasks||!o.stages)throw 0;S=o;save();D.close();draw()}catch(x){$('#bk_m').textContent='That text is not a valid backup.'}}
else if(k=='rst'){if(a.dataset.c){S=seed();save();D.close();draw()}else{a.dataset.c=1;a.textContent='Click again to reset everything'}}});
document.addEventListener('input',ev=>{const f=ev.target.dataset.f,l=ev.target.dataset.fl;
if(f){const p=f.split('.'),k=p.pop();let o=S;p.forEach(x=>o=o[x]);o[k]=ev.target.value;save()}
if(l){F[l]=ev.target.type=='checkbox'?+ev.target.checked:ev.target.value;l=='q'?drawList():draw()}});
document.addEventListener('change',ev=>{if(ev.target.dataset.fl&&ev.target.type!='checkbox'&&ev.target.dataset.fl!='q'){}
if(ev.target.id=='rd'&&ev.target.value){S.r=ev.target.value;save();draw()}
if(ev.target.id=='cvf'&&ev.target.files[0]){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.brand.cover=c.toDataURL('image/jpeg',.82);save();draw()};im.src=fr.result};fr.readAsDataURL(ev.target.files[0])}});
const theme=()=>{if(S.th)document.documentElement.dataset.theme=S.th};
$('#th').onclick=()=>{const cur=S.th||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');S.th=cur=='dark'?'light':'dark';theme();save()};
$('#bk').onclick=openBk;theme();draw();
</script></body></html>
