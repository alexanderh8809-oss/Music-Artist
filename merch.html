<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Merch · Xander Hudson</title>
  <meta name="description" content="Postcards from Xander Hudson's first songs. Each one ships with an image, a place and a date.">
  <meta name="theme-color" content="#131417">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Gloock&family=Hanken+Grotesk:wght@400;500&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .merch-hero { padding: 56px 0 28px; }
    .merch-hero h1 { font-size: clamp(44px, 11vw, 84px); margin: 12px 0 14px; }
    .merch-hero p { color: var(--bone-dim); max-width: 46ch; margin: 0; }
    .merch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 34px 24px; padding: 28px 0 80px; }
    .pc--featured { grid-column: 1 / -1; }
    @media (min-width: 720px) {
      .pc--featured { flex-direction: row; gap: 10px; }
      .pc--featured .pc__front { flex: 1.4; }
      .pc--featured .pc__meta { flex: 1; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 18px; }
      .pc--featured .pc__title { font-size: 34px; }
      .pc--featured .pc__buy { align-items: flex-start; }
    }
    .merch-note { color: var(--bone-dim); font-size: 15px; margin: 0 0 60px; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="./">Xander Hudson</a>
    <nav class="site-nav" aria-label="Main">
      <a href="./">Home</a>
      <a href="journey.html">Journey</a>
      <a href="merch.html" aria-current="page">Merch</a>
      <a class="btn btn--hit btn--sm hide-sm" href="#join" data-join>Join</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="merch-hero">
      <span class="label">Merch</span>
      <h1>Postcards.</h1>
      <p>One for each of the early songs. Each postcard ships with an image, a place and a date.</p>
    </section>
    <section class="merch-grid" aria-label="Postcards"></section>
    <p class="merch-note">Shipping worldwide. Questions about an order? Email the address below.</p>
  </main>

  <footer class="site-footer"></footer>

  <script src="content/config.js"></script>
  <script src="content/merch.js"></script>
  <script src="js/site.js"></script>
  <script src="js/cards.js"></script>
  <script>
    (function () {
      const items = (window.MERCH || []).slice().sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
      document.querySelector(".merch-grid").innerHTML = items.map((m, i) => window.XH.postcard(m, i)).join("");
    })();
  </script>
</body>
</html>
